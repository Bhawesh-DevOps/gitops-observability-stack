apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stack-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bhawesh-DevOps/gitops-observability-stack.git'
    targetRevision: HEAD
    path: helm/kube-prometheus-stack
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
