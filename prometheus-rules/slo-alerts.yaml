apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: enterprise-sre-slo-alerts
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: slo.rules
      rules:
        - alert: ServiceLatencyHighP99
          expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 0.35
          for: 2m
          labels:
            severity: critical
            tier: production
          annotations:
            summary: "Service {{ $labels.service }} P99 latency exceeded 350ms SLO"
            description: "High latency detected for {{ $labels.service }}. Current value: {{ $value }}s"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted more than 2 times in 5 minutes."

        - alert: NodeDiskPressure
          expr: node_filesystem_free_bytes{mountpoint="/"}/node_filesystem_size_bytes{mountpoint="/"} < 0.15
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node disk space below 15%"
            description: "Root partition on node {{ $labels.instance }} has less than 15% disk space available."
